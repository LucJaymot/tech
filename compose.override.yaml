
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "127.0.0.1:5432:5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"
      # Web UI. MAILPIT_UI_BIND=0.0.0.0 makes it reachable from a phone on the LAN.
      - "${MAILPIT_UI_BIND:-127.0.0.1}:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
