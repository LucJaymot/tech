framework:
    notifier:
        chatter_transports:
        texter_transports:
            # Browsers' Web Push (App\Notifier\WebPushTransport); "null://null" sends nothing.
            webpush: '%env(WEBPUSH_DSN)%'
        channel_policy:
            # use chat/slack, chat/telegram, sms/twilio or sms/nexmo
            urgent: ['email']
            high: ['email']
            medium: ['email']
            low: ['email']
        admin_recipients:
            - { email: admin@example.com }
