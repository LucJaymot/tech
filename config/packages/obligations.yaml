parameters:
    # Administrative tasks of a soirée, generated by App\Obligations\RetroplanningGenerator.
    # These rules are indicative: re-check each source, then update its verifiee_le
    # (quoted, or YAML reads it as a timestamp).
    #   conditions: all must hold, an omitted one matches any soirée. An unknown
    #     lieu or jauge never matches: lieu_non_amenage, jauge_superieure_a.
    #     Others: buvette, artistes_payes (booleans).
    #   decalage_jours: due date relative to the soirée's date, negative = before.
    app.obligations.regles:
        -   code: sacem
            libelle: 'Déclarer la soirée à la Sacem'
            conditions: {}
            decalage_jours: -15
            source: 'https://www.douarnenez.bzh/wp-content/uploads/2022/08/Organismes_ressources_pour_lorganisation_de_vos_spectacles.pdf'
            verifiee_le: '2026-10-13'
        -   code: buvette_temporaire
            libelle: 'Demander l''autorisation de buvette temporaire (groupes 1 et 3) en mairie'
            conditions: {buvette: true}
            decalage_jours: -15
            source: 'https://www.associatheque.fr/fr/organiser-une-manifestation/buvette.html'
            verifiee_le: '2026-10-13'
        -   code: rassemblement_festif
            libelle: 'Déclarer le rassemblement festif à caractère musical en préfecture (plus de 500 personnes, lieu non aménagé)'
            conditions: {lieu_non_amenage: true, jauge_superieure_a: 500}
            decalage_jours: -30
            source: 'https://www.gendarmerie.interieur.gouv.fr/gendelus/securite-locale-et-teleservices/gestion-des-troubles-a-l-ordre-public/rassemblements-festifs-a-caractere-musical-quelles-sont-les-regles'
            verifiee_le: '2026-10-13'
        -   code: manifestation_plus_1500
            libelle: 'Déclarer la manifestation de plus de 1 500 personnes au maire'
            conditions: {jauge_superieure_a: 1500}
            decalage_jours: -30
            source: 'https://www.oise.gouv.fr/index.php/contenu/telechargement/78116/570769/file/formulaire%20V2022.pdf'
            verifiee_le: '2026-10-13'
        -   code: spectacle_occasionnel
            libelle: 'Déclarer la représentation (organisateur occasionnel de spectacles)'
            conditions: {artistes_payes: true}
            decalage_jours: -30
            source: 'https://www.culture.gouv.fr/Media/Medias-creation-rapide/Vos-demarches-et-responsabilites-en-tant-qu-organisateur-occasionnel-de-spectacles-vivants'
            verifiee_le: '2026-10-13'
        -   code: guso_dus
            libelle: 'Faire la déclaration unique et simplifiée (Guso) et payer les cotisations'
            conditions: {artistes_payes: true}
            decalage_jours: 15
            source: 'https://sites.service-information-publique.fr/pays-d-azay-le-rideau/guide-associations/F1928.html'
            verifiee_le: '2026-10-13'

    # Yearly limits, counted over the calendar year on the collective's soirées.
    #   critere: the soirée flag that counts: artistes_payes, buvette, soutien.
    app.obligations.seuils_annuels:
        -   code: representations
            libelle: 'Représentations avec artistes payés, sans licence d''entrepreneur de spectacles'
            critere: artistes_payes
            limite: 6
            source: 'https://www.culture.gouv.fr/Media/Medias-creation-rapide/Vos-demarches-et-responsabilites-en-tant-qu-organisateur-occasionnel-de-spectacles-vivants'
            verifiee_le: '2026-10-13'
        -   code: buvettes
            libelle: 'Autorisations de buvette temporaire'
            critere: buvette
            limite: 5
            source: 'https://www.associatheque.fr/fr/organiser-une-manifestation/buvette.html'
            verifiee_le: '2026-10-13'
        -   code: manifestations_soutien
            libelle: 'Manifestations de soutien exonérées d''impôts'
            critere: soutien
            limite: 6
            source: 'https://www.associatheque.fr/fr/fiscalite-des-associations/cas-d-exoneration.html'
            verifiee_le: '2026-10-13'
